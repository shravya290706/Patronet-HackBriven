<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="acc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19191d"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="kb-case" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a34"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#acc-bg)"/>

  <!-- Orange Aura -->
  <circle cx="250" cy="250" r="150" fill="#FF6B00" opacity="0.05"/>

  <!-- Mechanical Keyboard (75% compact angle) -->
  <g transform="translate(60, 160)">
    <!-- Case Base -->
    <rect x="0" y="0" width="280" height="150" rx="10" fill="url(#kb-case)" stroke="#3e3e4d" stroke-width="2"/>
    <!-- Keyplate area -->
    <rect x="10" y="10" width="260" height="130" rx="6" fill="#121216"/>

    <!-- Rotary Encoder Knob (Top Right) -->
    <circle cx="252" cy="24" r="8" fill="#FF6B00" stroke="#cc5500" stroke-width="1.5"/>

    <!-- Key Rows Grid Representation -->
    <!-- Row 1 -->
    <rect x="16" y="18" width="18" height="12" rx="2" fill="#2d2d38" stroke="#FF6B00" stroke-width="1"/>
    <rect x="38" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="60" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="82" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="104" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="126" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="148" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="170" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="192" y="18" width="18" height="12" rx="2" fill="#252530"/>
    <rect x="214" y="18" width="24" height="12" rx="2" fill="#2d2d38"/>

    <!-- Row 2 -->
    <rect x="16" y="34" width="24" height="14" rx="2" fill="#2d2d38"/>
    <rect x="44" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="66" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="88" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="110" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="132" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="154" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="176" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="198" y="34" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="220" y="34" width="22" height="14" rx="2" fill="#252530"/>
    <rect x="246" y="34" width="18" height="14" rx="2" fill="#2d2d38"/>

    <!-- Row 3 -->
    <rect x="16" y="52" width="28" height="14" rx="2" fill="#2d2d38"/>
    <rect x="48" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="70" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="92" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="114" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="136" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="158" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="180" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="202" y="52" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="224" y="52" width="40" height="14" rx="2" fill="#FF6B00"/>

    <!-- Row 4 -->
    <rect x="16" y="70" width="36" height="14" rx="2" fill="#2d2d38"/>
    <rect x="56" y="70" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="78" y="70" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="100" y="70" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="122" y="70" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="144" y="70" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="166" y="70" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="188" y="70" width="18" height="14" rx="2" fill="#252530"/>
    <rect x="210" y="70" width="32" height="14" rx="2" fill="#2d2d38"/>
    <rect x="246" y="70" width="18" height="14" rx="2" fill="#2d2d38"/>

    <!-- Row 5 (Spacebar row) -->
    <rect x="16" y="88" width="22" height="14" rx="2" fill="#2d2d38"/>
    <rect x="42" y="88" width="20" height="14" rx="2" fill="#2d2d38"/>
    <rect x="66" y="88" width="24" height="14" rx="2" fill="#2d2d38"/>
    <rect x="94" y="88" width="100" height="14" rx="2" fill="#32323e" stroke="#3e3e4e" stroke-width="1"/>
    <rect x="198" y="88" width="20" height="14" rx="2" fill="#2d2d38"/>
    <rect x="222" y="88" width="18" height="14" rx="2" fill="#FF6B00"/>
    <rect x="244" y="88" width="20" height="14" rx="2" fill="#2d2d38"/>

    <!-- Subtle RGB underline glow -->
    <line x1="16" y1="120" x2="264" y2="120" stroke="#FF6B00" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Precision Wireless Mouse (Right side) -->
  <g transform="translate(360, 200)">
    <path d="M 40 0 C 15 0, 0 35, 0 75 C 0 120, 15 145, 40 145 C 65 145, 80 120, 80 75 C 80 35, 65 0, 40 0 Z" fill="#1c1c22" stroke="#3e3e4d" stroke-width="2"/>
    <!-- Mouse button divider -->
    <line x1="40" y1="8" x2="40" y2="60" stroke="#121215" stroke-width="2"/>
    <!-- Scroll Wheel (Aluminum with orange rim) -->
    <rect x="36" y="24" width="8" height="22" rx="3" fill="#2a2a34" stroke="#FF6B00" stroke-width="1"/>
    <!-- Subtle thumb rest contour -->
    <path d="M 0 50 Q -10 80 0 110" fill="none" stroke="#353542" stroke-width="1.5"/>
  </g>

  <!-- Drop Shadow -->
  <ellipse cx="250" cy="355" rx="200" ry="14" fill="#000000" opacity="0.6"/>
</svg>
