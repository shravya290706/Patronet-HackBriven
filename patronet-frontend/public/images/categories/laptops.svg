<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="laptop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="laptop-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="50%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF8833" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="aluminum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d3d45"/>
      <stop offset="50%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#1e1e24"/>
    </linearGradient>
  </defs>

  <!-- Background base -->
  <rect width="800" height="500" fill="url(#laptop-bg)"/>

  <!-- Subtle Studio Ambient Grid / Aura -->
  <circle cx="400" cy="220" r="260" fill="#FF6B00" opacity="0.06"/>
  <circle cx="400" cy="220" r="140" fill="#FF6B00" opacity="0.08"/>

  <!-- Laptop Display Lid -->
  <g transform="translate(160, 70)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="480" height="290" rx="14" fill="#0d0d10" stroke="#33333d" stroke-width="2"/>
    <!-- Screen Glass -->
    <rect x="18" y="16" width="444" height="258" rx="6" fill="url(#laptop-screen)"/>
    <!-- Display Graphics / Code Editor & Waveform aesthetic -->
    <path d="M 40 50 L 140 50 M 40 70 L 220 70 M 40 90 L 180 90 M 40 110 L 260 110" stroke="#4a4a58" stroke-width="4" stroke-linecap="round"/>
    <!-- Orange accent telemetry bar -->
    <rect x="40" y="145" width="280" height="3" rx="1.5" fill="url(#orange-glow)"/>
    <rect x="40" y="160" width="180" height="2" rx="1" fill="#FF6B00" opacity="0.6"/>
    <!-- Geometric tech grid lines on right screen side -->
    <circle cx="370" cy="140" r="45" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.4"/>
    <circle cx="370" cy="140" r="28" fill="none" stroke="#555566" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="325" y1="140" x2="415" y2="140" stroke="#FF6B00" stroke-width="1.5" opacity="0.4"/>
    <line x1="370" y1="95" x2="370" y2="185" stroke="#FF6B00" stroke-width="1.5" opacity="0.4"/>

    <!-- Subtle Screen Reflection Sweep -->
    <polygon points="18,16 260,16 120,274 18,274" fill="#ffffff" opacity="0.02"/>

    <!-- WebCam -->
    <circle cx="240" cy="8" r="3" fill="#1f1f24"/>
    <circle cx="240" cy="8" r="1.5" fill="#00e5ff" opacity="0.5"/>
  </g>

  <!-- Laptop Base Chasis & Keyboard Deck (Perspective) -->
  <g transform="translate(100, 355)">
    <!-- Main base top deck -->
    <polygon points="60,0 540,0 595,70 5,70" fill="url(#aluminum)" stroke="#454552" stroke-width="1.5"/>
    <!-- Front edge lip -->
    <polygon points="5,70 595,70 590,82 10,82" fill="#16161a"/>
    <!-- Recessed keyboard tray -->
    <polygon points="110,8 490,8 525,48 75,48" fill="#121215" stroke="#26262e" stroke-width="1"/>
    <!-- Keyboard key rows hint -->
    <line x1="120" y1="18" x2="480" y2="18" stroke="#22222a" stroke-width="5" stroke-dasharray="14 3"/>
    <line x1="110" y1="28" x2="490" y2="28" stroke="#22222a" stroke-width="5" stroke-dasharray="16 3"/>
    <line x1="100" y1="38" x2="500" y2="38" stroke="#22222a" stroke-width="5" stroke-dasharray="18 4"/>
    <!-- Trackpad -->
    <polygon points="250,52 350,52 355,68 245,68" fill="#202026" stroke="#33333d" stroke-width="1"/>
    <!-- Front indicator light -->
    <circle cx="300" cy="76" r="1.5" fill="#FF6B00"/>
  </g>

  <!-- Dark plinth / shadow base -->
  <ellipse cx="400" cy="442" rx="320" ry="16" fill="#000000" opacity="0.6"/>
</svg>
