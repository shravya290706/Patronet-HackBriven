<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="game-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282832"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#101016"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#game-bg)"/>

  <!-- Dynamic Orange Performance Aura -->
  <circle cx="400" cy="225" r="210" fill="#FF6B00" opacity="0.06"/>
  <circle cx="400" cy="225" r="130" fill="#FF6B00" opacity="0.09"/>

  <!-- Pro Gaming Controller Body -->
  <g transform="translate(400, 225)">
    <!-- Controller Silhouette -->
    <path d="M -140 -80 C -110 -100 -50 -95 0 -85 C 50 -95 110 -100 140 -80 C 180 -50 200 40 180 120 C 170 150 145 160 120 135 C 100 115 85 70 50 65 C 20 60 -20 60 -50 65 C -85 70 -100 115 -120 135 C -145 160 -170 150 -180 120 C -200 40 -180 -50 -140 -80 Z" fill="url(#body-grad)" stroke="#3d3d4d" stroke-width="2.5"/>

    <!-- Ergonomic Grips Texture -->
    <path d="M -170 20 C -185 60 -165 115 -145 125" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 170 20 C 185 60 165 115 145 125" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Left Thumbstick (Concave top with orange ring) -->
    <g transform="translate(-75, -25)">
      <circle cx="0" cy="0" r="32" fill="#141419" stroke="#33333f" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="#202028" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="18" fill="#181820"/>
      <!-- Cross grip dots -->
      <circle cx="0" cy="-10" r="2" fill="#555566"/>
      <circle cx="0" cy="10" r="2" fill="#555566"/>
      <circle cx="-10" cy="0" r="2" fill="#555566"/>
      <circle cx="10" cy="0" r="2" fill="#555566"/>
    </g>

    <!-- Right Thumbstick (Lower center right) -->
    <g transform="translate(35, 15)">
      <circle cx="0" cy="0" r="30" fill="#141419" stroke="#33333f" stroke-width="2"/>
      <circle cx="0" cy="0" r="24" fill="#202028" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="16" fill="#181820"/>
      <circle cx="0" cy="-8" r="1.5" fill="#555566"/>
      <circle cx="0" cy="8" r="1.5" fill="#555566"/>
      <circle cx="-8" cy="0" r="1.5" fill="#555566"/>
      <circle cx="8" cy="0" r="1.5" fill="#555566"/>
    </g>

    <!-- D-Pad (Left lower) -->
    <g transform="translate(-35, 15)">
      <path d="M -8 -26 L 8 -26 L 8 -8 L 26 -8 L 26 8 L 8 8 L 8 26 L -8 26 L -8 8 L -26 8 L -26 -8 L -8 -8 Z" fill="#1b1b24" stroke="#383848" stroke-width="1.5"/>
      <polygon points="0,-22 -4,-16 4,-16" fill="#555566"/>
      <polygon points="0,22 -4,16 4,16" fill="#555566"/>
      <polygon points="-22,0 -16,-4 -16,4" fill="#555566"/>
      <polygon points="22,0 16,-4 16,4" fill="#555566"/>
    </g>

    <!-- Action Buttons (ABXY - Right upper) -->
    <g transform="translate(75, -25)">
      <!-- Y (Top) -->
      <circle cx="0" cy="-22" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
      <text x="0" y="-18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#FF6B00" text-anchor="middle">Y</text>

      <!-- A (Bottom) -->
      <circle cx="0" cy="22" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#00e5ff" text-anchor="middle">A</text>

      <!-- X (Left) -->
      <circle cx="-22" cy="0" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
      <text x="-22" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#76ff03" text-anchor="middle">X</text>

      <!-- B (Right) -->
      <circle cx="22" cy="0" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
      <text x="22" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ff1744" text-anchor="middle">B</text>
    </g>

    <!-- Center Trackpad / Logo Bar -->
    <rect x="-42" y="-55" width="84" height="28" rx="6" fill="#101015" stroke="#2b2b36" stroke-width="1"/>
    <!-- Status LED -->
    <line x1="-20" y1="-34" x2="20" y2="-34" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Ground reflection / shadow -->
  <ellipse cx="400" cy="385" rx="240" ry="18" fill="#000000" opacity="0.65"/>
</svg>
