<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wear-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
    <linearGradient id="strap-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="50%" stop-color="#2d2d38"/>
      <stop offset="100%" stop-color="#1c1c22"/>
    </linearGradient>
    <radialGradient id="dial-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e26"/>
      <stop offset="75%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
  </defs>

  <rect width="500" height="500" fill="url(#wear-bg)"/>

  <!-- Orange Pulse Aura -->
  <circle cx="250" cy="250" r="150" fill="#FF6B00" opacity="0.06"/>

  <!-- Silicone / Titanium Strap Top -->
  <path d="M 205 60 L 295 60 L 285 180 L 215 180 Z" fill="url(#strap-grad)" stroke="#383845" stroke-width="1.5"/>
  <line x1="220" y1="90" x2="280" y2="90" stroke="#16161b" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="115" x2="278" y2="115" stroke="#16161b" stroke-width="3" stroke-linecap="round"/>
  <line x1="224" y1="140" x2="276" y2="140" stroke="#16161b" stroke-width="3" stroke-linecap="round"/>

  <!-- Silicone / Titanium Strap Bottom -->
  <path d="M 215 320 L 285 320 L 295 440 L 205 440 Z" fill="url(#strap-grad)" stroke="#383845" stroke-width="1.5"/>
  <line x1="224" y1="360" x2="276" y2="360" stroke="#16161b" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="385" x2="278" y2="385" stroke="#16161b" stroke-width="3" stroke-linecap="round"/>
  <line x1="220" y1="410" x2="280" y2="410" stroke="#16161b" stroke-width="3" stroke-linecap="round"/>

  <!-- Watch Chassis (Matte Obsidian) -->
  <rect x="180" y="165" width="140" height="170" rx="42" fill="#141419" stroke="#484856" stroke-width="2.5"/>

  <!-- Crown Button (Right) -->
  <rect x="320" y="200" width="8" height="24" rx="2" fill="#FF6B00" stroke="#cc5500" stroke-width="1"/>
  <rect x="320" y="250" width="6" height="32" rx="2" fill="#2d2d38"/>

  <!-- AMOLED Screen Bezel & Display Face -->
  <rect x="194" y="179" width="112" height="142" rx="30" fill="url(#dial-grad)"/>

  <!-- UI Elements: Activity Rings & Telemetry -->
  <circle cx="250" cy="245" r="42" fill="none" stroke="#22222c" stroke-width="7"/>
  <circle cx="250" cy="245" r="42" fill="none" stroke="#FF6B00" stroke-width="7" stroke-dasharray="190 264" stroke-linecap="round" transform="rotate(-90 250 245)"/>

  <circle cx="250" cy="245" r="30" fill="none" stroke="#22222c" stroke-width="6"/>
  <circle cx="250" cy="245" r="30" fill="none" stroke="#00e5ff" stroke-width="6" stroke-dasharray="130 188" stroke-linecap="round" transform="rotate(-90 250 245)"/>

  <!-- Digital Time Readout -->
  <text x="250" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">10:42</text>
  <text x="250" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#FF6B00" text-anchor="middle">128 BPM</text>

  <!-- Screen curved glass gleam -->
  <path d="M 205 190 Q 250 200 295 190" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>

  <!-- Drop Shadow -->
  <ellipse cx="250" cy="455" rx="100" ry="12" fill="#000000" opacity="0.6"/>
</svg>
