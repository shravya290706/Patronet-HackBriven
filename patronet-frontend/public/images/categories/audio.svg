<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="audio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181c"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="headband-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="50%" stop-color="#40404c"/>
      <stop offset="100%" stop-color="#2a2a32"/>
    </linearGradient>
    <radialGradient id="earcup-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="85%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </radialGradient>
  </defs>

  <rect width="600" height="450" fill="url(#audio-bg)"/>

  <!-- Subtle Acoustic Wave Ambient Aura -->
  <circle cx="300" cy="225" r="170" fill="#FF6B00" opacity="0.05"/>
  <circle cx="300" cy="225" r="110" fill="#FF6B00" opacity="0.07"/>

  <!-- Headphones Structure -->
  <!-- Outer Headband Arch -->
  <path d="M 180 230 C 180 100, 420 100, 420 230" fill="none" stroke="url(#headband-grad)" stroke-width="26" stroke-linecap="round"/>
  <!-- Headband inner cushion -->
  <path d="M 215 195 C 215 125, 385 125, 385 195" fill="none" stroke="#1c1c22" stroke-width="12" stroke-linecap="round"/>

  <!-- Left Fork & Extension Strut -->
  <line x1="180" y1="215" x2="180" y2="250" stroke="#505060" stroke-width="8" stroke-linecap="round"/>
  <rect x="174" y="240" width="12" height="24" rx="3" fill="#25252e" stroke="#3d3d4a" stroke-width="1"/>

  <!-- Right Fork & Extension Strut -->
  <line x1="420" y1="215" x2="420" y2="250" stroke="#505060" stroke-width="8" stroke-linecap="round"/>
  <rect x="414" y="240" width="12" height="24" rx="3" fill="#25252e" stroke="#3d3d4a" stroke-width="1"/>

  <!-- Left Ear Cup (Angled 3D view) -->
  <g transform="translate(180, 275) rotate(-6)">
    <!-- Outer Cup -->
    <ellipse cx="0" cy="0" rx="42" ry="62" fill="url(#earcup-glow)" stroke="#383844" stroke-width="2"/>
    <!-- Metal Chamfer Rim -->
    <ellipse cx="0" cy="0" rx="32" ry="50" fill="#18181e" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Center Aluminum Disc -->
    <ellipse cx="0" cy="0" rx="18" ry="28" fill="#22222a" stroke="#484855" stroke-width="1"/>
    <!-- ANC Mic Pinholes -->
    <circle cx="0" cy="-38" r="1.5" fill="#40404a"/>
    <circle cx="0" cy="38" r="1.5" fill="#40404a"/>
  </g>

  <!-- Right Ear Cup (Angled 3D view) -->
  <g transform="translate(420, 275) rotate(6)">
    <!-- Outer Cup -->
    <ellipse cx="0" cy="0" rx="42" ry="62" fill="url(#earcup-glow)" stroke="#383844" stroke-width="2"/>
    <!-- Metal Chamfer Rim -->
    <ellipse cx="0" cy="0" rx="32" ry="50" fill="#18181e" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Center Aluminum Disc -->
    <ellipse cx="0" cy="0" rx="18" ry="28" fill="#22222a" stroke="#484855" stroke-width="1"/>
    <!-- ANC Mic Pinholes -->
    <circle cx="0" cy="-38" r="1.5" fill="#40404a"/>
    <circle cx="0" cy="38" r="1.5" fill="#40404a"/>
  </g>

  <!-- Ambient Shadow Plinth -->
  <ellipse cx="300" cy="390" rx="190" ry="14" fill="#000000" opacity="0.65"/>
</svg>
