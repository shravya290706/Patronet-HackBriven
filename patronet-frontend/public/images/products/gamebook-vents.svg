<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="vents-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vent-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a34"/>
      <stop offset="100%" stop-color="#14141a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#vents-aura)"/>

  <!-- Rear Thermal Vents / Exhaust View -->
  <g transform="translate(60, 240)">
    <!-- Rear Chassis Panel -->
    <rect x="0" y="0" width="480" height="110" rx="10" fill="url(#vent-metal)" stroke="#3e3e4d" stroke-width="2"/>

    <!-- Left Thermal Grill Array -->
    <g transform="translate(30, 25)">
      <rect x="0" y="0" width="150" height="60" rx="4" fill="#0d0d12" stroke="#252530" stroke-width="1"/>
      <line x1="15" y1="5" x2="15" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="30" y1="5" x2="30" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="45" y1="5" x2="45" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="60" y1="5" x2="60" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="75" y1="5" x2="75" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="90" y1="5" x2="90" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="105" y1="5" x2="105" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="120" y1="5" x2="120" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="135" y1="5" x2="135" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
    </g>

    <!-- Center Ports (HDMI, RJ45, DC-in) -->
    <g transform="translate(205, 35)">
      <rect x="0" y="5" width="22" height="14" rx="2" fill="#0a0a0e" stroke="#555566" stroke-width="1"/>
      <rect x="28" y="3" width="18" height="18" rx="2" fill="#0a0a0e" stroke="#555566" stroke-width="1"/>
      <circle cx="58" cy="12" r="6" fill="#0a0a0e" stroke="#555566" stroke-width="1"/>
    </g>

    <!-- Right Thermal Grill Array -->
    <g transform="translate(300, 25)">
      <rect x="0" y="0" width="150" height="60" rx="4" fill="#0d0d12" stroke="#252530" stroke-width="1"/>
      <line x1="15" y1="5" x2="15" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="30" y1="5" x2="30" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="45" y1="5" x2="45" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="60" y1="5" x2="60" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="75" y1="5" x2="75" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="90" y1="5" x2="90" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="105" y1="5" x2="105" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="120" y1="5" x2="120" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
      <line x1="135" y1="5" x2="135" y2="55" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
    </g>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="400" rx="250" ry="14" fill="#000000" opacity="0.12"/>
</svg>
