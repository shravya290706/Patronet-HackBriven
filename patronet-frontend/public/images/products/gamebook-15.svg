<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="prod-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body-laptop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a32"/>
      <stop offset="100%" stop-color="#141418"/>
    </linearGradient>
  </defs>

  <!-- Ambient background -->
  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#prod-aura)"/>

  <!-- Laptop Open View -->
  <g transform="translate(100, 110)">
    <!-- Screen Lid -->
    <rect x="30" y="20" width="340" height="210" rx="10" fill="#121216" stroke="#33333d" stroke-width="2"/>
    <rect x="42" y="32" width="316" height="186" rx="4" fill="#1c1c24"/>
    <!-- Screen graphic lines -->
    <line x1="60" y1="60" x2="160" y2="60" stroke="#444455" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="80" x2="220" y2="80" stroke="#444455" stroke-width="4" stroke-linecap="round"/>
    <rect x="60" y="110" width="180" height="3" rx="1.5" fill="#FF6B00"/>
    <circle cx="280" cy="120" r="35" fill="none" stroke="#FF6B00" stroke-width="1.5" opacity="0.6"/>

    <!-- Base -->
    <polygon points="0,230 400,230 420,330 -20,330" fill="url(#body-laptop)" stroke="#3e3e4a" stroke-width="1.5"/>
    <polygon points="40,240 360,240 375,300 25,300" fill="#16161b"/>
    <polygon points="150,305 250,305 255,325 145,325" fill="#25252e"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="460" rx="220" ry="16" fill="#000000" opacity="0.12"/>
</svg>
