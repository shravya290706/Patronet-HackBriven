<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="air-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="air-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4a58"/>
      <stop offset="50%" stop-color="#2e2e38"/>
      <stop offset="100%" stop-color="#181820"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#air-aura)"/>

  <!-- Ultra-thin Laptop Open View -->
  <g transform="translate(110, 130)">
    <!-- Thin Bezel Screen -->
    <rect x="35" y="20" width="310" height="190" rx="8" fill="#15151a" stroke="#484856" stroke-width="1.5"/>
    <rect x="42" y="27" width="296" height="176" rx="4" fill="#202028"/>
    <!-- Screen graphic -->
    <circle cx="190" cy="115" r="40" fill="none" stroke="#FF6B00" stroke-width="2" opacity="0.8"/>
    <circle cx="190" cy="115" r="24" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>

    <!-- Slim Base Deck -->
    <polygon points="10,210 370,210 395,295 -15,295" fill="url(#air-silver)" stroke="#454555" stroke-width="1.5"/>
    <polygon points="45,218 335,218 350,268 30,268" fill="#131318"/>
    <polygon points="140,273 240,273 244,290 136,290" fill="#22222a"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="445" rx="200" ry="14" fill="#000000" opacity="0.12"/>
</svg>
