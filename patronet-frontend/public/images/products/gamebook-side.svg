<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="thumb-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thumb-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a34"/>
      <stop offset="50%" stop-color="#1c1c24"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#thumb-aura)"/>

  <!-- Laptop Side Profile Ports -->
  <g transform="translate(60, 260)">
    <!-- Wedge chassis side profile -->
    <polygon points="20,40 460,40 450,75 10,65" fill="url(#thumb-metal)" stroke="#3e3e4d" stroke-width="2"/>
    <!-- Screen closed profile on top -->
    <polygon points="18,22 462,22 460,36 19,36" fill="#15151c" stroke="#353542" stroke-width="1.5"/>

    <!-- Thunderbolt 4 Ports -->
    <rect x="70" y="47" width="22" height="9" rx="3" fill="#0d0d12" stroke="#FF6B00" stroke-width="1"/>
    <rect x="105" y="47" width="22" height="9" rx="3" fill="#0d0d12" stroke="#FF6B00" stroke-width="1"/>

    <!-- 3.5mm Headphone Jack -->
    <circle cx="155" cy="51" r="5" fill="#0d0d12" stroke="#555566" stroke-width="1"/>

    <!-- MicroSD slot -->
    <rect x="180" y="50" width="28" height="4" rx="1" fill="#0d0d12"/>

    <!-- Cooling Exhaust Fin array (Rear) -->
    <line x1="390" y1="45" x2="390" y2="68" stroke="#0d0d12" stroke-width="2.5"/>
    <line x1="400" y1="45" x2="400" y2="68" stroke="#0d0d12" stroke-width="2.5"/>
    <line x1="410" y1="45" x2="410" y2="68" stroke="#0d0d12" stroke-width="2.5"/>
    <line x1="420" y1="45" x2="420" y2="68" stroke="#0d0d12" stroke-width="2.5"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="370" rx="240" ry="14" fill="#000000" opacity="0.12"/>
</svg>
