<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="kbdeck-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck-al" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d38"/>
      <stop offset="50%" stop-color="#1e1e26"/>
      <stop offset="100%" stop-color="#14141a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#kbdeck-aura)"/>

  <!-- Top-Down View of Keyboard Deck & Trackpad -->
  <g transform="translate(80, 100)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="440" height="380" rx="16" fill="url(#deck-al)" stroke="#454555" stroke-width="2"/>

    <!-- Power button (top right) -->
    <circle cx="395" cy="40" r="7" fill="#14141a" stroke="#FF6B00" stroke-width="1.5"/>

    <!-- Keyboard Recess -->
    <rect x="35" y="65" width="370" height="195" rx="8" fill="#121216" stroke="#252530" stroke-width="1.5"/>

    <!-- Key Rows -->
    <line x1="45" y1="95" x2="395" y2="95" stroke="#252532" stroke-width="16" stroke-dasharray="20 4"/>
    <line x1="45" y1="125" x2="395" y2="125" stroke="#252532" stroke-width="18" stroke-dasharray="22 4"/>
    <line x1="45" y1="155" x2="395" y2="155" stroke="#252532" stroke-width="18" stroke-dasharray="24 4"/>
    <line x1="45" y1="185" x2="395" y2="185" stroke="#252532" stroke-width="18" stroke-dasharray="26 4"/>
    <!-- Spacebar row -->
    <rect x="135" y="210" width="170" height="20" rx="3" fill="#30303c" stroke="#484858" stroke-width="1"/>
    <!-- WASD Highlight -->
    <rect x="75" y="115" width="20" height="20" rx="3" fill="#FF6B00"/>

    <!-- Glass Trackpad -->
    <rect x="135" y="280" width="170" height="85" rx="6" fill="#1c1c24" stroke="#3a3a48" stroke-width="1.5"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="510" rx="220" ry="16" fill="#000000" opacity="0.12"/>
</svg>
