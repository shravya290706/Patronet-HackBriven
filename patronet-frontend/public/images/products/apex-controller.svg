<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="ctrl-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ctrl-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a34"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#ctrl-aura)"/>

  <!-- Controller Top View -->
  <g transform="translate(300, 300)">
    <path d="M -150 -90 C -120 -115 -55 -105 0 -95 C 55 -105 120 -115 150 -90 C 190 -60 215 35 195 125 C 185 155 155 170 130 145 C 110 125 90 75 55 70 C 20 65 -20 65 -55 70 C -90 75 -110 125 -130 145 C -155 170 -185 155 -195 125 C -215 35 -190 -60 -150 -90 Z" fill="url(#ctrl-body)" stroke="#3e3e4e" stroke-width="2.5"/>

    <!-- Left Thumbstick -->
    <g transform="translate(-80, -28)">
      <circle cx="0" cy="0" r="32" fill="#141419" stroke="#33333f" stroke-width="2"/>
      <circle cx="0" cy="0" r="25" fill="#202028" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="16" fill="#181820"/>
    </g>

    <!-- Right Thumbstick -->
    <g transform="translate(38, 16)">
      <circle cx="0" cy="0" r="30" fill="#141419" stroke="#33333f" stroke-width="2"/>
      <circle cx="0" cy="0" r="23" fill="#202028" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.8"/>
      <circle cx="0" cy="0" r="14" fill="#181820"/>
    </g>

    <!-- D-Pad -->
    <g transform="translate(-38, 16)">
      <path d="M -8 -26 L 8 -26 L 8 -8 L 26 -8 L 26 8 L 8 8 L 8 26 L -8 26 L -8 8 L -26 8 L -26 -8 L -8 -8 Z" fill="#1b1b24" stroke="#383848" stroke-width="1.5"/>
    </g>

    <!-- ABXY Buttons -->
    <g transform="translate(80, -28)">
      <circle cx="0" cy="-22" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
      <circle cx="0" cy="22" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
      <circle cx="-22" cy="0" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
      <circle cx="22" cy="0" r="9" fill="#1a1a24" stroke="#383848" stroke-width="1.5"/>
    </g>

    <!-- Center LED Accent -->
    <rect x="-35" y="-55" width="70" height="24" rx="5" fill="#101015"/>
    <line x1="-16" y1="-37" x2="16" y2="-37" stroke="#FF6B00" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="475" rx="220" ry="16" fill="#000000" opacity="0.12"/>
</svg>
