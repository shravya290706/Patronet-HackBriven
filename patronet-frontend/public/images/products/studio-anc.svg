<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="anc-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cup-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#30303a"/>
      <stop offset="85%" stop-color="#181820"/>
      <stop offset="100%" stop-color="#101015"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#anc-aura)"/>

  <!-- Headphones -->
  <g transform="translate(300, 270)">
    <!-- Arch -->
    <path d="M -110 30 C -110 -110, 110 -110, 110 30" fill="none" stroke="#252530" stroke-width="24" stroke-linecap="round"/>
    <path d="M -80 0 C -80 -80, 80 -80, 80 0" fill="none" stroke="#181820" stroke-width="12" stroke-linecap="round"/>

    <!-- Left Fork -->
    <line x1="-110" y1="20" x2="-110" y2="50" stroke="#484858" stroke-width="8" stroke-linecap="round"/>
    <!-- Right Fork -->
    <line x1="110" y1="20" x2="110" y2="50" stroke="#484858" stroke-width="8" stroke-linecap="round"/>

    <!-- Left Ear Cup -->
    <g transform="translate(-110, 75) rotate(-6)">
      <ellipse cx="0" cy="0" rx="36" ry="54" fill="url(#cup-grad)" stroke="#3a3a46" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="26" ry="42" fill="#16161c" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle cx="0" cy="0" r="14" fill="#242430"/>
    </g>

    <!-- Right Ear Cup -->
    <g transform="translate(110, 75) rotate(6)">
      <ellipse cx="0" cy="0" rx="36" ry="54" fill="url(#cup-grad)" stroke="#3a3a46" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="26" ry="42" fill="#16161c" stroke="#FF6B00" stroke-width="1.5" stroke-opacity="0.7"/>
      <circle cx="0" cy="0" r="14" fill="#242430"/>
    </g>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="460" rx="160" ry="14" fill="#000000" opacity="0.12"/>
</svg>
