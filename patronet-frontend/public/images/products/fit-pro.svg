<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="watch-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="watch-dial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22222a"/>
      <stop offset="70%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="#f8f8f8"/>
  <circle cx="300" cy="300" r="220" fill="url(#watch-aura)"/>

  <!-- Watch Straps -->
  <path d="M 245 90 L 355 90 L 340 210 L 260 210 Z" fill="#24242e" stroke="#3d3d4b" stroke-width="1.5"/>
  <path d="M 260 390 L 340 390 L 355 510 L 245 510 Z" fill="#24242e" stroke="#3d3d4b" stroke-width="1.5"/>

  <!-- Watch Body -->
  <rect x="220" y="200" width="160" height="195" rx="46" fill="#141419" stroke="#484858" stroke-width="2.5"/>

  <!-- Orange Crown -->
  <rect x="380" y="240" width="10" height="28" rx="2" fill="#FF6B00"/>
  <rect x="380" y="300" width="8" height="36" rx="2" fill="#30303c"/>

  <!-- Screen -->
  <rect x="236" y="216" width="128" height="163" rx="34" fill="url(#watch-dial)"/>

  <!-- Watch Telemetry Rings -->
  <circle cx="300" cy="295" r="48" fill="none" stroke="#252532" stroke-width="8"/>
  <circle cx="300" cy="295" r="48" fill="none" stroke="#FF6B00" stroke-width="8" stroke-dasharray="210 301" stroke-linecap="round" transform="rotate(-90 300 295)"/>

  <circle cx="300" cy="295" r="34" fill="none" stroke="#252532" stroke-width="6"/>
  <circle cx="300" cy="295" r="34" fill="none" stroke="#00e5ff" stroke-width="6" stroke-dasharray="140 213" stroke-linecap="round" transform="rotate(-90 300 295)"/>

  <text x="300" y="290" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">09:41</text>
  <text x="300" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FF6B00" text-anchor="middle">8,420 STEPS</text>

  <!-- Shadow -->
  <ellipse cx="300" cy="525" rx="120" ry="14" fill="#000000" opacity="0.12"/>
</svg>
